name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
defaults:
  run:
    shell: bash
    working-directory: swift

jobs:
  build-ubuntu-latest:
    name: Swift ${{ matrix.swift }} on ubuntu-latest
    strategy:
      matrix:
        # ubuntu swift5.6及以下版本下载会报gpg签名错误，已知bug等官方解决
        swift: ["5.7", "5.8", "5.9", "5.10", "6.0", "6.1"]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  coverage:
    name: Swift source coverage
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
    - name: Run tests with coverage
      run: swift test --enable-code-coverage
    - name: Export source coverage
      run: |
        xcrun llvm-cov export \
          .build/debug/DarabonbaXMLPackageTests.xctest/Contents/MacOS/DarabonbaXMLPackageTests \
          -instr-profile=.build/debug/codecov/default.profdata \
          -format=lcov Sources/DarabonbaXML/*.swift > .build/coverage.lcov
    - name: Require 90 percent source coverage
      run: |
        awk -F: '
          /^LF:/ { total += $2 }
          /^LH:/ { covered += $2 }
          END {
            if (total == 0) { print "No production coverage found"; exit 1 }
            printf "Production line coverage: %.2f%% (%d/%d)\n", 100 * covered / total, covered, total
            exit (covered * 100 < total * 90)
          }
        ' .build/coverage.lcov
    - uses: codecov/codecov-action@v3
      with:
        flags: swift
        files: swift/.build/coverage.lcov

  build-macos-latest:
    name: Swift ${{ matrix.swift }} on macos-latest
    strategy:
      matrix:
        swift: ["5.9", "5.10", "6.0", "6.1"]
      fail-fast: false
    runs-on: macos-latest
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - name: Verify Xcode Version
      run: xcodebuild -version
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  build-macos-11:
    name: Swift ${{ matrix.swift }} on macos-11
    strategy:
      matrix:
        swift: ["5.6", "5.7", "5.8"]
      fail-fast: false
    runs-on: macos-11
    steps:
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift }}
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
